name: validate

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:syntax:all
      - name: Verify standalone website package
        run: |
          python3 tools/build-standalone.py --output "$RUNNER_TEMP/system-override" --receipt "$RUNNER_TEMP/standalone-build-receipt.json"
          node tools/check-standalone-build.js "$RUNNER_TEMP/system-override"
      - name: Check Cache Road music in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run check:cache-road-browser
      - name: Check combat chase in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CACHE_COMBAT_BROWSER_OUTPUT: ${{ runner.temp }}/cache-combat-browser
          CACHE_COMBAT_BROWSER_REQUIRE_HOSTED: '1'
          CACHE_COMBAT_BROWSER_GPU_BACKEND: swiftshader
        run: npm run check:cache-combat-browser
      - name: Check music automation in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MUSIC_BROWSER_OUTPUT: ${{ runner.temp }}/music-browser/synthetic
        run: node tools/check-music-audibility.cjs
      - name: Render original music A/B in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MUSIC_FETCH_ASSETS: '1'
          MUSIC_BROWSER_OUTPUT: ${{ runner.temp }}/music-browser/original-tracks
        run: node tools/check-music-audibility.cjs
      - name: Check mode sounds in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MODE_SFX_REVIEW: '1'
          MUSIC_BROWSER_OUTPUT: ${{ runner.temp }}/music-browser/mode-sfx
        run: node tools/check-music-audibility.cjs
      - name: Upload music audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-browser-${{ github.sha }}
          path: ${{ runner.temp }}/music-browser
          if-no-files-found: ignore
      - name: Upload Cache Road driving review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-road-review-${{ github.sha }}
          path: ${{ runner.temp }}/music-browser/cache-road
          if-no-files-found: ignore
      - name: Check background video in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          BACKGROUND_BROWSER_OUTPUT: ${{ runner.temp }}/background-browser
        run: node tools/check-background-browser.cjs
      - name: Upload background browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-browser-${{ github.sha }}
          path: ${{ runner.temp }}/background-browser
          if-no-files-found: ignore
      - name: Check intro visibility in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          INTRO_BROWSER_OUTPUT: ${{ runner.temp }}/intro-browser
        run: node tools/check-intro-browser.cjs
      - name: Upload intro browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-browser-${{ github.sha }}
          path: ${{ runner.temp }}/intro-browser
          if-no-files-found: ignore
      - name: Check title settings in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SETTINGS_BROWSER_OUTPUT: ${{ runner.temp }}/settings-browser
        run: node tools/check-settings-browser.cjs
      - name: Check Cache Line bridge in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CACHE_BRIDGE_BROWSER_OUTPUT: ${{ runner.temp }}/cache-bridge-review/docs/source-pack/review-cache-bridge/browser
        run: node tools/check-cache-bridge-browser.cjs
      - name: Upload Cache Line bridge browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-bridge-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cache-bridge-review
          if-no-files-found: ignore
      - name: Check Cache Line ending in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CACHE_ENDING_BROWSER_OUTPUT: ${{ runner.temp }}/cache-ending-review
        run: npm run check:cache-ending-browser
      - name: Check Cache Road encounter art and input in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CACHE_ENCOUNTERS_BROWSER_OUTPUT: ${{ runner.temp }}/cache-encounters-browser
        run: npm run check:cache-encounters-browser
      - name: Upload combat chase browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-combat-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cache-combat-browser
          if-no-files-found: ignore
      - name: Check Cache pursuit showdown in real Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CACHE_PURSUIT_BROWSER_OUTPUT: ${{ runner.temp }}/cache-pursuit-browser
          CACHE_PURSUIT_BROWSER_REQUIRE_HOSTED: '1'
        run: npm run check:cache-pursuit-browser
      - name: Upload Cache pursuit browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-pursuit-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cache-pursuit-browser
          if-no-files-found: ignore
      - name: Upload Cache Road encounter browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-encounters-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cache-encounters-browser
          if-no-files-found: ignore
      - name: Upload Cache Line ending browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-ending-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cache-ending-review
          if-no-files-found: ignore
      - name: Upload settings browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-browser-${{ github.sha }}
          path: ${{ runner.temp }}/settings-browser
          if-no-files-found: ignore
      - name: Export current source pack
        env:
          PACK_RECEIPT: ${{ runner.temp }}/source-pack-tests.json
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['PACK_RECEIPT']).write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'],
              'automatedTests': {'npm test': 'passed', 'npm run check:syntax:all': 'passed', 'npm run check:cache-road-browser': 'passed (real MP3s, missing local asset recovery, Drive catch and collision bus recovery)', 'node tools/check-music-audibility.cjs': 'passed (controlled and original MP3s)', 'node tools/check-background-browser.cjs': 'passed', 'node tools/check-intro-browser.cjs': 'passed', 'node tools/check-settings-browser.cjs': 'passed', 'node tools/check-cache-bridge-browser.cjs': 'passed (eight hosted byte-identical paintings, shared Canvas, production bridge input and final Drive guard)', 'MODE_SFX_REVIEW=1 node tools/check-music-audibility.cjs': 'passed'},
              'cacheCombatBrowser': 'passed (fresh v4 real shoulder/trigger controls, actual attacks/12HP rig, earned saves, and consecutive chase/boss shared-loop frames with raster flush within 33.33ms median; hosted byte-verified art, controlled host clock, not Makko/device acceptance)',
              'cachePursuitBrowser': 'passed (production gamepad race, three-system boss defeat, real painted art, shared Canvas/RAF and paused state; staged visual diagnostics separately labelled)',
              'cacheEndingBrowser': 'passed (four hosted byte-identical paintings, production shared Canvas/input/RAF/audio and silent ending reload)',
              'cacheEncountersBrowser': 'passed (four hosted byte-identical sprites, native Drive/steering/Echo, shared Canvas and three explicitly staged production draw screenshots)',
              'makkoPlaytest': 'not recorded by CI',
              'workflowRun': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          }, indent=2))
          PY
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 tools/build-source-pack.py --revision "$GITHUB_SHA" --base "$GITHUB_SHA" --state merged --validation-file "$PACK_RECEIPT" --output "$RUNNER_TEMP/BARCODE-System-Override-Source-Pack-v5.zip"
          else
            python3 tools/build-source-pack.py --revision "$GITHUB_SHA" --state review --validation-file "$PACK_RECEIPT" --output "$RUNNER_TEMP/BARCODE-System-Override-Source-Pack-v5.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BARCODE-System-Override-Source-Pack-v5-${{ github.sha }}
          path: ${{ runner.temp }}/BARCODE-System-Override-Source-Pack-v5.zip
          if-no-files-found: error
      - name: Prepare standalone merged source pack
        if: github.ref == 'refs/heads/main'
        run: python3 -m zipfile -e "$RUNNER_TEMP/BARCODE-System-Override-Source-Pack-v5.zip" "$RUNNER_TEMP/source-pack-content"
      - name: Upload standalone merged source pack
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BARCODE-System-Override-Source-Pack-v5-content-${{ github.sha }}
          path: ${{ runner.temp }}/source-pack-content/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
