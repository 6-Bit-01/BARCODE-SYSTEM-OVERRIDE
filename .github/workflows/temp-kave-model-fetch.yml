name: Temporary Kave transcription model fetch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify Whisper Large v3 Turbo Q4_0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            -o ggml-large-v3-turbo-q4_0.bin \
            'https://huggingface.co/Pomni/whisper-large-v3-turbo-ggml-allquants/resolve/main/ggml-large-v3-turbo-q4_0.bin?download=true'
          echo '2ceb779ca61ce46ed6e9aa43c4a0f8a89a37f683df3c0ba3119238fcd5852155  ggml-large-v3-turbo-q4_0.bin' | sha256sum --check

      - name: Upload Large v3 Turbo Q4_0
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q4_0
          path: ggml-large-v3-turbo-q4_0.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
