name: Temporary Kave transcription model fetch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download English Whisper models
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            -o ggml-small.en-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin?download=true'
          echo 'bfdff4894dcb76bbf647d56263ea2a96645423f1669176f4844a1bf8e478ad30  ggml-small.en-q5_1.bin' | sha256sum --check

          curl --fail --location --retry 5 --retry-delay 3 \
            -o ggml-medium.en-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en-q5_0.bin?download=true'
          echo '76733e26ad8fe1c7a5bf7531a9d41917b2adc0f20f2e4f5531688a8c6cd88eb0  ggml-medium.en-q5_0.bin' | sha256sum --check

      - name: Upload small English model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-en-q5_1
          path: ggml-small.en-q5_1.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload medium English model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-medium-en-q5_0
          path: ggml-medium.en-q5_0.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
