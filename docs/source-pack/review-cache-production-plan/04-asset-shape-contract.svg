    <rect x="548" y="182" width="42" height="22" fill="#8e4d91" stroke="#ee8fc6" stroke-width="2"/>
    <path d="M48 361Q120 333 205 312T358 283M452 266Q534 245 612 240" fill="none" stroke="#73e6d0" stroke-width="5" stroke-dasharray="15 7"/>
    <path d="M48 361Q120 333 205 312T358 283M452 266Q534 245 612 240" fill="none" stroke="#091827" stroke-width="1"/>
    <rect x="28" y="160" width="32" height="325" fill="url(#hatch)"/>
    <rect x="596" y="160" width="32" height="325" fill="url(#hatch)"/>
  </g>
  <g clip-path="url(#rightClip)">
    <path d="M652 234Q734 251 806 266L829 271M891 286Q1040 313 1124 351T1252 379V485H652Z" fill="#395357"/>
    <path d="M652 234Q734 251 806 266L829 271M891 286Q1040 313 1124 351T1252 379V485H652Z" fill="url(#hatch)"/>
    <path d="M681 268v-75l17-23h82l18 22v76Z" fill="#47616a" stroke="#99c1c5" stroke-width="3"/>
