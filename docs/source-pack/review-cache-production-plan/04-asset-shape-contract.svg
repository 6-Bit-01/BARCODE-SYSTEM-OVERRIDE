<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Cache Road left and right modular plate anatomy</title>
  <desc id="desc">Two asymmetrical bank plates show transparent roof silhouettes, a clear local-street socket, an overscanned ground bleed, terrain contact points, and opposite road-facing slopes. Below, a depth-layer diagram shows how nearer ground hides the feet of farther illustrated buildings.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#667d8d" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="12" height="12" fill="#876e47" fill-opacity=".15"/>
      <path d="M0 0V12" stroke="#f1c176" stroke-opacity=".45" stroke-width="3"/>
    </pattern>
    <clipPath id="leftClip"><rect x="28" y="90" width="600" height="395"/></clipPath>
    <clipPath id="rightClip"><rect x="652" y="90" width="600" height="395"/></clipPath>
    <g id="houseTall">
      <path d="M0 64V15L15 0H89L104 16V140H0Z" fill="#355a6b" stroke="#77c7d1" stroke-width="2"/>
      <path d="M15 44h20v28H15Zm50 0h20v28H65Zm-30 49h31v46H35Z" fill="#e9bb7e" opacity=".7"/>
      <path d="M0 15L15 0H89l15 16" fill="none" stroke="#e286bf" stroke-width="4"/>
    </g>
    <g id="houseShort">
      <path d="M0 36L16 9h82l19 27v110H0Z" fill="#47616a" stroke="#9bc2c4" stroke-width="2"/>
      <path d="M14 56h35v40H14Zm58 0h29v40H72Z" fill="#e6ae79" opacity=".7"/>
      <path d="M0 36L16 9h82l19 27" fill="none" stroke="#83dace" stroke-width="4"/>
    </g>
    <g id="sign"><path d="M0 33V0h10v33" stroke="#a4c8cb" stroke-width="3"/><rect x="-18" y="-20" width="47" height="23" fill="#8e4d91" stroke="#ee8fc6" stroke-width="2"/></g>
  </defs>
  <rect width="1280" height="920" fill="#091827"/>
  <text x="30" y="43" fill="#f2f5ec" font-family="sans-serif" font-size="27" font-weight="600">ONE MODULAR BANK PLATE: CUTOUT + METADATA + SHARED GROUND</text>
  <text x="30" y="72" fill="#b5cbd0" font-family="sans-serif" font-size="17">Schematic asset anatomy. The live renderer determines the final curve and projection.</text>

  <rect x="28" y="90" width="600" height="395" fill="url(#grid)" stroke="#47606a"/>
  <rect x="652" y="90" width="600" height="395" fill="url(#grid)" stroke="#47606a"/>
  <text x="48" y="122" fill="#f1c176" font-family="sans-serif" font-size="20" font-weight="600">LEFT BANK</text>
  <text x="672" y="122" fill="#f1c176" font-family="sans-serif" font-size="20" font-weight="600">RIGHT BANK</text>
  <text x="50" y="152" fill="#c2d6d5" font-family="sans-serif" font-size="16">outer edge</text>
  <text x="503" y="152" fill="#c2d6d5" font-family="sans-serif" font-size="16">road →</text>
  <text x="675" y="152" fill="#c2d6d5" font-family="sans-serif" font-size="16">← road</text>
  <text x="1150" y="152" fill="#c2d6d5" font-family="sans-serif" font-size="16">outer edge</text>

  <!-- The edge hash is surplus paint that sits underneath the next segment. -->
  <g clip-path="url(#leftClip)">
    <path d="M28 379Q105 350 196 321T360 286L389 282M451 266Q523 249 628 234V485H28Z" fill="#395357"/>
