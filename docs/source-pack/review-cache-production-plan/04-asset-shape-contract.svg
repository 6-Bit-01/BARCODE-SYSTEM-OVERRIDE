  <path d="M420 472V330M860 472V330" stroke="#f9d690" stroke-width="2" marker-end="none"/>
  <text x="333" y="470" fill="#f9d690" font-family="sans-serif" font-size="16">street socket</text>
  <text x="777" y="470" fill="#f9d690" font-family="sans-serif" font-size="16">street socket</text>
  <circle cx="48" cy="361" r="6" fill="#73e6d0"/><circle cx="205" cy="312" r="6" fill="#73e6d0"/><circle cx="358" cy="283" r="6" fill="#73e6d0"/><circle cx="612" cy="240" r="6" fill="#73e6d0"/>
  <circle cx="668" cy="240" r="6" fill="#73e6d0"/><circle cx="828" cy="267" r="6" fill="#73e6d0"/><circle cx="1063" cy="317" r="6" fill="#73e6d0"/><circle cx="1232" cy="361" r="6" fill="#73e6d0"/>

  <text x="30" y="528" fill="#f2f5ec" font-family="sans-serif" font-size="23" font-weight="600">WHAT THE CUTOUT ACTUALLY CONTAINS</text>
  <g font-family="sans-serif" font-size="17" fill="#d6e5df">
    <text x="49" y="567">1. Transparent sky and irregular roofs; no rectangular skyline edge.</text>
    <text x="49" y="597">2. Buildings at one depth band, entrances facing a legal parcel/sidewalk.</text>
    <text x="49" y="627">3. A deliberate open street socket; no facade is cut by an arbitrary road mask.</text>
    <text x="49" y="657">4. Extra image below the mint contact points; nearer ground hides that bleed.</text>
    <text x="49" y="687">5. Overlap-safe margins at both ends; a wall, corner, or roof hides the join.</text>
  </g>
  <path d="M30 722H1250" stroke="#46606b"/>
  <text x="30" y="755" fill="#f2f5ec" font-family="sans-serif" font-size="23" font-weight="600">THREE DIFFERENT IMAGE JOBS</text>
  <rect x="30" y="779" width="390" height="93" fill="#1b3d50"/>
  <rect x="444" y="779" width="390" height="93" fill="#51375b"/>
  <rect x="858" y="779" width="390" height="93" fill="#604b33"/>
  <g font-family="sans-serif" fill="#f1f4ee">
    <text x="45" y="808" font-size="18" font-weight="600">REAR ROOF PLATE</text>
    <text x="45" y="837" font-size="16">Broad skyline; slow lateral motion.</text>
    <text x="45" y="859" font-size="16">Buried behind the middle strip.</text>
    <text x="459" y="808" font-size="18" font-weight="600">MIDDLE BLOCK PLATE</text>
    <text x="459" y="837" font-size="16">Connected buildings and courts.</text>
    <text x="459" y="859" font-size="16">Its feet hide under near ground.</text>
    <text x="873" y="808" font-size="18" font-weight="600">NEAR FRONTAGE</text>
    <text x="873" y="837" font-size="16">Shop fronts, turns, corner detail.</text>
    <text x="873" y="859" font-size="16">Approaches and exits the frame.</text>
  </g>
  <text x="30" y="900" fill="#aebfc1" font-family="sans-serif" font-size="15">The shared ground skin and paved road geometry are separate projected layers; the mint curve is live mask metadata, not a painted border.</text>
</svg>
